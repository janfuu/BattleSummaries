# Battle Summaries: the settings shown on SkyrimNet's own settings page. What is set there takes precedence over
# BattleSummaries.ini; a change takes effect when the next battle begins or a save is loaded.
plugin:
  name: BattleSummaries
  version: "1.3.0"
  description: "Gives NPCs a factual summary of each battle near the player, in place of the raw combat events."

schema:
  fields:
    - name: "Ignore friendly fire"
      path: "summary.ignore_friendly_fire"
      type: "bool"
      description: "Friendly fire is harm from someone on the same side, such as a follower caught in your fireball, or to a bystander caught in the crossfire during a fight. Off: it is told as an accident. On: it is left out of the summaries, so followers stop bringing it up. A death by friendly fire is always told."
      defaultValue: false
      category: "Summary"

    - name: "Ignore effects that did no damage"
      path: "summary.ignore_harmless_effects"
      type: "bool"
      description: "Damage effects (drained of life, burned, frozen, shocked, poisoned, hurt) are told only when they took health from the person. On: one that did no damage, such as a mod's aura pulsing over everyone nearby, is left out. Off: every damage effect is told when it lands. Paralysis, fear, calm and slows are always told."
      defaultValue: true
      category: "Summary"

    - name: "Mention bystanders who were killed"
      path: "summary.mention_bystanders"
      type: "bool"
      description: "Someone killed in a battle without being a fighter (a townsman caught in it) is left out of the summaries by default, so followers don't read it as the player murdering people. On: they are told as not actively engaged in combat. Anyone who would fight you on sight counts as an enemy either way, even when killed before they noticed you."
      defaultValue: false
      category: "Summary"

    - name: "Show damage numbers"
      path: "summary.show_numbers"
      type: "bool"
      description: "Add raw damage and healing points to the summary. Off by default: amounts are told in words, because language models tend to recite any figure they are given."
      defaultValue: false
      category: "Summary"

    - name: "Summary lifetime (game hours)"
      path: "summary.game_hours"
      type: "float"
      description: "How long after a battle its summary is still given to dialogue. After that only the remembered event is left."
      defaultValue: 6.0
      category: "Summary"

    - name: "Remember battles"
      path: "memory.remember_battles"
      type: "bool"
      description: "Register one remembered SkyrimNet event for each battle worth remembering."
      defaultValue: true
      category: "Memory"

    - name: "Injuries from injury mods"
      path: "mods.injuries"
      type: "bool"
      description: "Tell injuries given by injury mods such as Blade and Blunt and Wildcat."
      defaultValue: true
      category: "Other mods"

    - name: "Beheadings and severed limbs"
      path: "mods.dismemberment"
      type: "bool"
      description: "Tell beheadings and severed limbs: the game's own, Dismembering Framework's and Next-Gen Decapitations'."
      defaultValue: true
      category: "Other mods"
