; Battle Summaries: every piece of text the mod writes, with its built-in wording.
;
; THIS FILE IS A REFERENCE. It is replaced whenever the mod is updated, so do not edit it.
; To change a phrase, create BattleSummaries_Text.ini next to this file and copy into it only the lines you
; want to change. That file is yours: the mod never ships or overwrites it.
;
; - Words in {braces} are filled in by the mod. Keep the ones you need; you may leave one out, but you cannot
;   use one that the phrase does not have (such a line is ignored and the built-in wording is used).
; - A {placeholder} that can be empty brings its own leading space or punctuation: write "fought{at_place}",
;   not "fought {at_place}".
; - A missing or empty line means the built-in wording.
; - Your file is read again whenever a battle begins, so a change can be tried without restarting the game.
;   BattleSummaries.log says how many of your lines were taken and names any it refused.
; - The headings in [brackets] are only for finding things: a line works under any heading.

[Battle]
; {at_place} is empty or a space and battle.at
battle.underway = A battle is being fought{at_place} right now.
battle.fought = A battle was fought{at_place}. It lasted {duration}.
battle.at = at {place}
; open country: {place} is the worldspace, "Skyrim"
battle.wilds = the wilds of {place}
battle.sides = {party} fought against {enemies}.
battle.enemies_only = The enemies were {enemies}.
; those who were struck but did not fight
battle.caught_up = Also caught up in it: {others}.

[Duration]
duration.second = 1 second
duration.seconds = {count} seconds
duration.minute = about 1 minute
duration.minutes = about {count} minutes
duration.hour = about 1 hour
duration.hours = about {count} hours
duration.hours_half = about {count}.5 hours

[Age]
; how long ago the battle was; the prompt puts it in its heading
age.now = now
age.moments = moments ago
age.short = a short while ago
age.hour_or_two = an hour or two ago
age.hours = some hours ago

[Lists]
; between the last two of a list: "a, b and c"
list.and = and
; several of the same name
list.times = {name} x{count}
; the rest of a list too long to tell
list.others = {count} others
; an actor with no name
name.someone = someone
; damage or a kill with nobody behind it
name.nobody = no one in particular
; a summoned or raised creature
name.commanded = {name} (commanded by {master})

[Outcome]
outcome.word_enemies = enemies
outcome.word_opponents = opponents
outcome.so_far = So far {dead} of the {total} {foes} are dead.
outcome.one = The one enemy was killed.
outcome.all = All {total} {foes} were killed.
outcome.none = None of the {total} {foes} were killed; the fight broke off.
outcome.some = {dead} of the {total} {foes} were killed; the rest fled, yielded or broke off.
; {tally} reads "Kaira 3 (Bandit x2 and Bandit Chief); Lydia 1 (Bandit)"
tally.line = Who killed the enemies: {tally}.
tally.unknown = unknown causes
; kills a summoned creature made, credited to whoever summoned it
tally.through = through {summons}

[Deaths]
killed.by = was killed by {killer}
killed.unknown = was killed, by whom is not known
; {killed} is killed.by or killed.unknown; {own_side} is empty or a comma and killed.own_side
killed.line = {name} {killed}{own_side}.
; an ally killed by their own side
killed.own_side = by accident: they were on the same side
; a citizen or guard killed without having raised a weapon or come at anyone
killed.not_fighting = {name}, who was not actively engaged in combat, {killed}.

[Wounds]
; {wounds} is one of wounds.*, {dealt} one of dealt.*
personal.wounds_dealt = {name} {wounds} and {dealt}.
wounds.none = took no damage worth the name
wounds.light = took only light wounds
wounds.solid = took solid wounds
wounds.bad = was badly hurt, taking nearly a full body's worth of damage
wounds.beyond_healed = took more damage than a body can survive in one go, and only kept going thanks to healing
wounds.brutal = took a brutal amount of damage
dealt.none = dealt no damage to anyone
dealt.all = dealt all the damage on their side
dealt.small = dealt only a small part of their side's damage
dealt.fair = dealt a fair share of their side's damage
dealt.large = dealt a large share of their side's damage
dealt.most = dealt most of their side's damage
; only with bShowNumbers
points = (about {points} points)

[NearDeath]
; {fact} is brink.down or brink.near_death
personal.fact = {name} {fact}.
; {times} is empty or a space and times.*; {by} is empty or a space and brink.by
brink.down = was struck down{times}{by}: collapsed, helpless and bleeding out, unable to fight
brink.near_death = was brought to the very edge of death{by}, with almost no health left
brink.by = by {name}
; added after brink.by when it was their own side
brink.friendly = (by accident: friendly fire)
times.twice = twice
times.many = {count} times
personal.already_low = {name} went into this fight already close to death from earlier wounds, and came through it without being hurt much further.
personal.hurt_badly = {name} was hurt badly at the worst of it, but was never at death's door.
personal.no_danger = {name} was never in serious danger.

[Rescue]
; what the assailant had done: fills {what}
rescue.struck_down = struck down
rescue.nearly_killed = nearly killed
rescue.recovered = {name} recovered enough to kill {assailant}, who had {what} {name}.
rescue.assailant_killed = {assailant}, who had {what} {name}, was then killed by {killer}.
; for the remembered paragraph
rescue.brief_killed = {killer} killed {assailant}
; fills {state}
rescue.state_down = down
rescue.state_deaths_door = at death's door
; {with} is empty or a space and heal.with
rescue.healed_while = While {name} was {state}, {healer} healed {name}{with}, {restoring}.
; for the remembered paragraph
rescue.brief_healed = {healer} healed {name}
rescue.plain = In plain terms: {saviors} saved {name}'s life in this battle. Without that help {name} would most likely have died.
rescue.none = {name} survived that without anyone's rescue.
; {deeds} is the rescue's own sentences, each after a space
rescue.saved_other = {name} saved {other}'s life.{deeds}

[Healing]
heal.self = {name} healed themself{with}, {restoring}.
heal.other = {healer} healed {name}{with}, {restoring}.
heal.with = with {source}
; {amount} is one of the three below
heal.restoring = restoring {amount} {name}'s health{points}
heal.little = a little of
heal.good = a good part of
heal.most = most or all of

[Injuries]
injury.carried = {name} went into this fight already carrying: {injuries}.
injury.new = {name} was injured in this fight and still carries it: {injuries}.
; for the remembered paragraph
injury.memory = {name} came out of it injured: {injuries}.
injury.dealt_by = {injury} (dealt by {name})
; an injury effect with no name of its own
injury.unnamed = an injury
; an injury mod's injury listed by its spell (sInjurySpells)
injury.serious = a serious injury
; the same, for one marked as lasting
injury.lasting = a lasting injury

[Effects]
; {effects} reads "burned by fire by Bandit Mage (Flames)"
effects.suffered = {name} suffered: {effects}.
effects.helped = {name} was helped by: {effects}.
effects.more = and {count} more
effect.by = by {name}
; a spell they cast on themself: "(own Stoneflesh)"
effect.own = own {source}

[FriendlyFire]
friendly.line = {name} was caught in their own side's attacks, by accident (friendly fire, not an attack on them): {what}.
; a bystander who fought nobody, struck by the player's side during a fight
friendly.crossfire_line = {name} was caught in the crossfire, by accident (not an attack on them): {what}.
friendly.damage = took part of their damage from {names}

[Kills]
; {victims} is empty or a colon and the names
kills.mine = {name} killed {count} of the {total} who died on the other side{victims}.
; the part of those kills their summoned creatures made
kills.through = {count} of them through {summons}.
kills.none = {name} killed none of the {total} who died on the other side.

[Moments]
; {with} is empty or a space and moment.with
moment.at_once = {killer} killed {count} at once{with}: {victims}.
; the spell or weapon
moment.with = with {means}
maim.beheaded = {killer} beheaded {victims}.
maim.dismembered = {killer} dismembered {victims}, severing a limb.
maim.head_unknown = {victims} lost their head in the fighting.
maim.limb_unknown = {victims} lost a limb in the fighting.

[Others]
; {facts} are joined with semicolons
other.line = {name}: {facts}.
other.saved_by = was saved by {saviors}
other.already_low = went in already close to death from earlier wounds
other.no_danger = was never near death
other.injured = was injured ({injuries})
other.kills_none = killed none of the other side
other.kills = killed {count} of the other side
; an easy fight: said in place of a line for each
other.easy = None of them was seriously hurt or in any real danger.

[Memory]
; the remembered paragraph
memory.rescued = {name} {brink}, and would most likely have died, but {deeds}: {saviors} saved {name}'s life.
memory.survived = {name} {brink}, but survived.

[EffectNames]
fx.healed = healed
fx.paralyzed = paralyzed
fx.fear = struck with magical fear
fx.frenzy = driven into a frenzy
fx.calm = magically calmed
fx.staggered = staggered
fx.disarmed = disarmed
fx.turned = turned and driven off
fx.soul_trapped = soul trapped
fx.banished = banished
fx.invisible = turned invisible
fx.emboldened = emboldened
fx.ethereal = made ethereal
fx.cloak_hostile = caught in a damaging cloak
fx.cloak = wrapped in a magical cloak
fx.poisoned = poisoned
fx.diseased = infected with disease
fx.slowed = slowed
fx.burned = burned by fire
fx.frozen = frozen by frost
fx.shocked = shocked by lightning
fx.drained_life = drained of life
; harm to health the mod cannot place: a spell, a bleed, a bite; it does not guess which
fx.hurt = hurt by a harmful effect
fx.drained_stamina = drained of stamina
fx.drained_magicka = drained of magicka
fx.armor_weakened = armor weakened
; a harmful effect the mod cannot place, by its own name
fx.afflicted = afflicted with {effect}
fx.warded = warded
fx.armored = shielded by magical armor
fx.resist_fire = protected against fire
fx.resist_frost = protected against frost
fx.resist_shock = protected against shock
fx.resist_magic = protected against magic
fx.resist_poison = protected against poison
fx.resist_disease = protected against disease
fx.health_fortified = health fortified
fx.stamina_restored = stamina restored
fx.magicka_restored = magicka restored
; a helpful effect the mod cannot place, by its own name
fx.aided = aided with {effect}
